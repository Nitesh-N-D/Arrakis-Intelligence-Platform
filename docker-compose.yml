version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: arrakis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/arrakis-intelligence
      JWT_ACCESS_SECRET: docker-access-secret
      JWT_REFRESH_SECRET: docker-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORM_THRESHOLD_MINUTES: 120
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:5173"

volumes:
  mongo-data:
