services:
  - type: web
    name: Arrakis-Intelligence-Platform
    runtime: docker
    branch: main
    region: singapore
    plan: free
    rootDir: server
    dockerfilePath: server/Dockerfile
    dockerContext: server
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
