<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storm Zone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="storm-body">
    <main class="storm-shell">
      <section class="storm-card">
        <p class="eyebrow">Arrakis Enforcement</p>
        <h1>You are entering a Storm Zone</h1>
        <p class="storm-copy" id="storm-copy">
          This destination is on your blocked list because it tends to erode focus and destabilize your spice harvest.
        </p>

        <div class="storm-meta">
          <span class="storm-chip" id="storm-host">Blocked site</span>
          <span class="storm-chip">Level: SPICE STORM</span>
          <span class="storm-chip" id="storm-policy">Policy: Adaptive block</span>
        </div>

        <p class="storm-copy" id="storm-policy-copy">
          You may request a short override if strict mode is not active.
        </p>

        <div class="storm-actions">
          <button id="override-button" class="primary-button" type="button">Override For 5 Minutes</button>
          <button id="go-back-button" class="secondary-button" type="button">Return To Safety</button>
        </div>
      </section>
    </main>

    <script src="block.js"></script>
  </body>
  </html>
